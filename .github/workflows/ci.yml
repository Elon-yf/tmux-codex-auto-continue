name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install linters
        run: |
          python -m pip install ruff
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Python checks
        run: |
          python bin/tmux-codex-auto-continue --self-test
          python -m py_compile bin/tmux-codex-auto-continue
          ruff check bin/tmux-codex-auto-continue
      - name: Shell checks
        run: shellcheck install.sh uninstall.sh tmux-codex-auto-continue.tmux
